  <rect x="760" y="412" width="140" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="830.0" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">填报数据</text>
  <text x="830.0" y="450" text-anchor="middle" font-size="11" fill="#6b7280">汇总区·明细·交叉表</text>
  <rect x="930" y="412" width="120" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
