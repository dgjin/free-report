  <text x="95" y="571" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">填报审批人</text>
  <rect x="40" y="76" width="1120" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.2" data-graph-role="decoration"/>
