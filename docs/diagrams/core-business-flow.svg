  <line x1="320" y1="668" x2="356" y2="668" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="364" y="672" font-size="12" fill="#6b7280">驳回 / 退回路径</text>
