server:
  port: 3001
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
  tomcat:
    threads:
      max: 200

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:freereport}?useSSL=${MYSQL_SSL:false}&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:freereport}
    password: ${MYSQL_PASSWORD:freereport123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: ${JWT_SECRET:YjM2N2Y0ZWE4NzQ3YmJlYTdjNTkwYjRiOGU0MGM0OTg=}
  expiration: 86400000
  # 滑动过期：token 剩余有效期低于该阈值时，服务端随响应头 X-Refreshed-Token 下发新 token
  renewal-threshold: ${JWT_RENEWAL_THRESHOLD:1800000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# 智能问数使用的大模型服务（OpenAI 兼容协议）
# 生产：DeepSeek；测试：本地 Ollama（AI_BASE_URL=http://localhost:11434/v1 AI_MODEL=qwen2.5 AI_API_KEY=ollama）
ai:
  enabled: ${AI_ENABLED:true}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  timeout-seconds: ${AI_TIMEOUT:60}
  reasoning-effort: ${AI_REASONING_EFFORT:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.freereport: info
    org.mybatis: warn
